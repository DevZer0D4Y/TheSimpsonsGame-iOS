# Functions the analyzer does not find on its own.
#
# Two groups. Upstream found the first by hand ("Unresolved call" stubs and
# boot crashes); they are copied from its functions_patch.toml, minus its
# "mega pass". That pass scanned data sections for code addresses. With this
# SDK's analyzer nearly all of them land inside known functions: SEH
# __try/__except scope addresses and switch-case labels. Declaring them split
# their functions and left ~3,400 REX_FATAL stubs, against 3 without them.
#
# The second group is every function upstream recompiled that lies wholly
# outside this analyzer's coverage: mostly this-adjusting vtable thunks
# ("addi r3,r3,-N; b target") and small virtuals, reachable only through
# vtables, so nothing branches to them.
